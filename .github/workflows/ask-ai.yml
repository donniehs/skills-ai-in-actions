name: Ask AI

on:
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  ask-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: AI Inference
        id: ai-response
        uses: actions/ai-inference@v3
        with:
          model: gpt-4o
          prompt: |
            Give me a programming joke.
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Display AI Response
        env:
          AI_RESPONSE: ${{ steps.ai-response.outputs.response }}
        run: |
          echo "## 🤖 AI Response" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$AI_RESPONSE" >> "$GITHUB_STEP_SUMMARY"
