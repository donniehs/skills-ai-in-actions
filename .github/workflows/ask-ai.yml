name: Ask AI

on:
  workflow_dispatch:

jobs:
  ask-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: AI Inference
        id: ai-response
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          RESPONSE=$(copilot -p "Give me a programming joke." -s --no-ask-user --model auto)
          {
            echo "response<<EOF"
            echo "$RESPONSE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Display AI Response
        env:
          AI_RESPONSE: ${{ steps.ai-response.outputs.response }}
        run: |
          echo "## 🤖 AI Response" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$AI_RESPONSE" >> "$GITHUB_STEP_SUMMARY"
