name: Ask AI

on:
  workflow_dispatch:

env:
  ACTIONS_STEP_DEBUG: true

permissions:
  contents: read

jobs:
  ask-ai:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: AI Inference
        id: ai-response
        uses: actions/ai-inference@v3
        with:
          prompt: |
            Give me a programming joke.
          model: auto
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Display AI Response
        env:
          AI_RESPONSE: ${{ steps.ai-response.outputs.response }}
        run: |
          echo "## AI Response" >> "$GITHUB_STEP_SUMMARY"
